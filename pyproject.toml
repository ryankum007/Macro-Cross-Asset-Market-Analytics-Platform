[project]
name = "macro-cross-asset-analytics-platform"
version = "0.1.0"
description = "Macro cross-asset analytics platform skeleton with ingest, analytics, viz, and UI."
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.3.0",
    "pandas>=2.2.2",
    "typer>=0.12.3",
    "matplotlib>=3.8.4",
    "yfinance>=0.2.40",
    "pandas-datareader>=0.10.0",
    "pyarrow>=15.0.2",
    "scikit-learn>=1.4.2",
    "streamlit>=1.32.0",
    "setuptools>=68.0",
]
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macro_platform"]

[tool.uv]
package = true

[tool.uv.sources]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.1",
    "mypy>=1.9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "build",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
plugins = []
